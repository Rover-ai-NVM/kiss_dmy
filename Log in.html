<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Log in</title>


</head>
<body>
    <header class="minimal-header">
        <a href="index.html" class="brand">Atelier Votre Nom</a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Connexion</h1>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemple@email.com"required/>
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="password">Mot de passe</label>
                        <a href="#" class="subtle-link">Oublié ?</a>
                    </div>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="........" required>
                        <button type="button" class="toggle-pwd">Afficher</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Se connecter</button>
            </form>

            <p id="feedback" class="feedback" role="status"></p>

            <p class="switch-page">
                pas de compte ? <a href="signup.html">Créer un compte</a>
            </p>
        </div>
    </main>
    <script src="log_in.js"></script>
</body>
</html>
